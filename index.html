<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theatre Seat Allocation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Booking Manager</p>
          <h1>Theatre Seat Allocation System</h1>
        </div>
      </header>

      <div id="message" class="message info" aria-live="polite">
        Welcome! Select a seat or use the booking form.
      </div>

      <main class="layout">
        <section class="panel seats-panel">
          <div class="panel-header">
            <h2>Seat Layout</h2>
            <span class="pill">10 Seats</span>
          </div>
          <div id="seatGrid" class="seat-grid" aria-label="Theatre seats"></div>
        </section>

        <aside class="panel sidebar">
          <div class="section-block">
            <h3>Reserve a Seat</h3>
            <form id="reserveForm" class="booking-form">
              <label for="reserveSeat">Seat number</label>
              <select id="reserveSeat" name="reserveSeat"></select>

              <label for="customerName">Customer name</label>
              <input id="customerName" name="customerName" type="text" maxlength="49" placeholder="Enter customer name" />

              <button type="submit" class="primary">Allocate seat</button>
            </form>
          </div>

          <div class="section-block">
            <h3>Cancel a Reservation</h3>
            <form id="cancelForm" class="booking-form">
              <label for="cancelSeat">Seat number</label>
              <select id="cancelSeat" name="cancelSeat"></select>
              <button type="submit" class="secondary">Cancel reservation</button>
            </form>
          </div>

          <div class="section-block">
            <h3>Available Seats</h3>
            <div id="availableSeats" class="available-seats">None</div>
          </div>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
